<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduQuest &mdash; Mulai Quest, Kuasai Pengetahuan!</title>
  <meta name="description" content="Jalankan quest edukatif melalui materi, latihan, dan kuis. Dapatkan petunjuk AI Tutor saat layanan tersedia.">
  <link rel="icon" href="data:,">

  <!-- Google Fonts: Baloo 2 & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS via CDN + konfigurasi tema EduQuest -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="js/tailwind-config.js"></script>

  <style type="text/tailwindcss">
    @layer components {
      .btn-primary { @apply inline-flex items-center justify-center gap-2 rounded-xl bg-brand-700 text-white font-display font-bold text-sm shadow-btn transition hover:bg-brand-600 hover:-translate-y-0.5 active:translate-y-0.5 active:shadow-none cursor-pointer; }
      .btn-lg { @apply px-8 py-4 text-base; }
      .btn-sm { @apply px-4 py-2 text-sm; }
      .btn-outline { @apply inline-flex w-full items-center justify-center rounded-xl border-2 border-brand-700 bg-white px-4 py-2.5 font-display text-sm font-bold text-brand-700 transition hover:bg-brand-50 cursor-pointer; }
      .pill { @apply inline-block rounded-full border border-brand-200 bg-white px-3.5 py-1 text-[11px] font-bold uppercase tracking-wider text-brand-700; }
      .card { @apply rounded-2xl border border-brand-100 bg-white p-6 shadow-card; }
      .section-title { @apply font-display text-3xl font-extrabold text-ink-900 sm:text-4xl leading-tight; }
    }
  </style>
</head>
<body class="flex min-h-screen flex-col bg-[#f8f6ff] font-sans text-slate-700 antialiased">

  <!-- Layout global: toast, modal autentikasi, modal fitur -->
  <div id="layout-toast"></div>
  <div id="layout-auth-modal"></div>
  <div id="layout-feature-modal"></div>

  <!-- Navbar utama -->
  <header id="layout-navbar" class="sticky top-0 z-40 border-b border-brand-100 bg-white/90 backdrop-blur"></header>

  <!-- Kontainer halaman yang diisi router -->
  <main class="mx-auto w-full max-w-7xl flex-1 px-4 py-8 sm:px-6">
    <div id="app-view">
      <div class="mx-auto max-w-2xl rounded-3xl border border-brand-100 bg-white p-6 text-center text-sm text-slate-500">
        Memuat EduQuest...
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer id="layout-footer" class="mt-auto bg-ink-950 text-white"></footer>

  <noscript>
    <div class="mx-auto my-6 max-w-2xl rounded-2xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-800">
      EduQuest membutuhkan JavaScript untuk menampilkan halaman.
    </div>
  </noscript>

  <!-- Aplikasi MVC (ES Modules) -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
